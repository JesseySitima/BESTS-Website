<!-- REPORTS SLIDER MODAL -->
<div
  id="reportsModal"
  class="fixed inset-0 hidden items-center justify-center bg-black/90 z-50"
>
  <div class="relative w-[92%] max-w-4xl bg-white rounded-2xl p-6 md:p-8">
    <!-- CLOSE -->
    <button
      id="closeReportsModal"
      class="absolute top-4 right-4 text-gray-500 hover:text-black text-xl z-10"
    >
      ✕
    </button>

    <h2 class="text-2xl font-bold mb-4">Sample Test Reports</h2>

    <!-- IMAGE VIEWER -->
    <div class="relative flex items-center justify-center">
      <!-- PREV -->
      <button
        onclick="prevReport()"
        class="absolute left-0 md:-left-10 text-3xl text-gray-600 hover:text-black px-3"
      >
        ‹
      </button>

      <!-- IMAGE -->
      <img
        id="reportImage"
        class="max-h-[70vh] rounded-lg shadow-lg transition-all duration-300 opacity-100 scale-100"
        src="assets/images/reports/report4.jpeg"
      />

      <!-- NEXT -->
      <button
        onclick="nextReport()"
        class="absolute right-0 md:-right-10 text-3xl text-gray-600 hover:text-black px-3"
      >
        ›
      </button>
    </div>

    <!-- DOTS -->
    <div id="reportDots" class="flex justify-center gap-2 mt-6"></div>
  </div>
</div>
