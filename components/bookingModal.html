<!-- BOOKING MODAL COMPONENT -->
<div
  id="bookingModal"
  class="fixed inset-0 hidden items-center justify-center bg-black/70 z-50"
>
  <div class="bg-white w-[92%] max-w-lg rounded-2xl p-6 md:p-8 relative">
    <!-- CLOSE BUTTON -->
    <button
      id="closeBookingModal"
      class="absolute top-4 right-4 text-gray-500 hover:text-black text-xl"
    >
      ✕
    </button>

    <h2 id="bookingTitle" class="text-2xl font-bold mb-2">
      Book a Spirometry Test
    </h2>
    <p class="text-sm text-gray-600 mb-6">
      Fill in your details and we’ll contact you shortly.
    </p>

    <form class="space-y-4">
      <input
        type="text"
        placeholder="Full Name"
        class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-yellow-500"
      />

      <input
        type="tel"
        placeholder="Phone Number"
        class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-yellow-500"
      />

      <input
        type="email"
        placeholder="Email Address"
        class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-yellow-500"
      />

      <select
        id="serviceType"
        class="w-full border rounded-lg p-3 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 border-gray-300 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-yellow-500"
      >
        <option value="spirometry">Spirometry Test</option>
        <option value="consultation">Consultation</option>
      </select>

      <textarea
        placeholder="Additional Notes"
        class="w-full border rounded-lg p-3 h-24 focus:outline-none focus:ring-2 focus:ring-yellow-500"
      ></textarea>

      <button
        type="submit"
        class="w-full bg-california-gold text-black font-semibold py-3 rounded-lg hover:opacity-90 transition"
      >
        Submit Booking
      </button>
    </form>
  </div>
</div>
